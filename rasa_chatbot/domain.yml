version: "3.1"

intents:
  - greet
  - goodbye
  - check_balance
  - provide_pin
  - ask_opening_hours
  - block_card
  - bot_challenge
  - out_of_scope
  - nlu_fallback

entities:
  - pin

slots:
  pin:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: pin

responses:
  utter_greet:
    - text: "Hello! I'm your banking assistant. How can I help you today?"
    - text: "Hi there! Welcome to your banking assistant. What can I do for you?"

  utter_goodbye:
    - text: "Goodbye! Have a great day!"
    - text: "See you later! Take care!"

  utter_ask_pin:
    - text: "Please provide your 4-digit PIN number to check your balance."
    - text: "To check your balance, I'll need your 4-digit PIN."

  utter_iamabot:
    - text: "I am a banking bot, powered by Rasa. I can help you check your account balance, provide opening hours, and assist with card blocking!"

  utter_opening_hours:
    - text: "Our bank is open Monday to Friday from 9:00 AM to 5:00 PM, and Saturday from 9:00 AM to 1:00 PM. We are closed on Sundays and public holidays."
    - text: "Banking hours:\n• Monday - Friday: 9:00 AM - 5:00 PM\n• Saturday: 9:00 AM - 1:00 PM\n• Sunday: Closed"

  utter_card_blocked:
    - text: "Your card has been blocked successfully for security purposes. Please visit your nearest branch with valid ID to get a replacement card, or call our customer service at 1-800-BANK-HELP."
    - text: "Card blocked! For your security, your card is now deactivated. To get a new card, please visit any branch with your ID or contact us at 1-800-BANK-HELP."

  utter_help:
    - text: "I can help you with:\n• Checking your account balance\n• Bank opening hours\n• Blocking your card\nWhat would you like to do?"

  utter_invalid_pin:
    - text: "That doesn't look like a valid PIN. Please provide a 4-digit number."

  utter_out_of_scope:
    - text: "I'm sorry, I can only help with checking your balance, providing opening hours, and blocking your card. For other banking services, please call 1-800-BANK-HELP or visit our website."
    - text: "I don't handle that type of request. I can help you check your balance, tell you our opening hours, or block your card. For anything else, please contact customer service at 1-800-BANK-HELP."

actions:
  - action_check_balance
